services:
  web:
    build:
      context: ..
      dockerfile: containers/web.Dockerfile
    ports:
      - '8080:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: containers/api.Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?PUBLIC_APP_ORIGIN is required}
      DATABASE_SSL_MODE: verify-full
      API_START_COMMAND: ${API_START_COMMAND:?Provide the reviewed API adapter command}
    expose: ['3000']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [postgres]

  worker:
    build:
      context: ..
      dockerfile: containers/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKER_START_COMMAND: ${WORKER_START_COMMAND:?Provide the reviewed worker command}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-human_bingo}
      POSTGRES_USER: ${POSTGRES_USER:-human_bingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${WAL_ARCHIVE_DIR:?WAL_ARCHIVE_DIR is required}:/var/lib/postgresql/wal-archive
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
